[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "caid-lite"
version = "0.1.0"
description = "Research engine for natural language → CadQuery → STEP/STL generation"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.25"]
cadquery = ["cadquery>=2.4"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]
all = [
    "caid-lite[anthropic]",
    "caid-lite[cadquery]",
    "caid-lite[dev]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that require real API keys (skip with '-m not integration')",
    "slow: unusually slow tests",
]

[tool.coverage.run]
source = ["src/caid_lite"]
omit = ["*/tests/*"]
