<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAID Lite</title>
  <link rel="stylesheet" href="style.css?v=2">
  <!-- highlight.js — Python syntax colouring for code modal -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js"></script>

  <!-- Three.js r160 via ESM import map -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header id="app-header">
    <span class="app-title">CAID Lite</span>
    <span id="conn-status" class="status-dot" title="Connecting…"></span>
  </header>

  <main class="workspace">

    <!-- ── Left: Parts Shelf ───────────────────────────────────────────── -->
    <aside id="parts-shelf">
      <div class="shelf-header">
        <h2>Parts</h2>
      </div>
      <ul id="parts-list">
        <li class="shelf-empty">No parts yet. Submit a prompt to start.</li>
      </ul>
    </aside>

    <!-- ── Center: 3D Workspace ───────────────────────────────────────── -->
    <section id="viewport">
      <div id="viewport-placeholder">
        <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="8" y="16" width="48" height="36" rx="2"/>
          <path d="M8 28 L32 20 L56 28"/>
          <path d="M32 20 L32 52"/>
        </svg>
        <p id="placeholder-text">Select a ready part to preview</p>
      </div>

      <canvas id="three-canvas"></canvas>

      <!-- View preset toolbar (top-right) -->
      <div id="view-toolbar">
        <button class="view-btn" data-view="iso"   title="Isometric view (Home)">Iso</button>
        <button class="view-btn" data-view="front" title="Front view (Numpad 1)">Front</button>
        <button class="view-btn" data-view="top"   title="Top view (Numpad 7)">Top</button>
        <button class="view-btn" data-view="right" title="Right view (Numpad 3)">Right</button>
        <span class="toolbar-sep"></span>
        <button id="wireframe-btn" class="view-btn" title="Toggle wireframe (W)">Wire</button>
      </div>

      <!-- Axis gizmo (bottom-right corner) -->
      <canvas id="gizmo-canvas" title="Viewport orientation gizmo (X=red, Y=green, Z=blue)"></canvas>

      <!-- Part info overlay (top-left) -->
      <div id="part-info">
        <div id="part-info-name"></div>
        <div id="part-info-meta"></div>
      </div>

      <!-- Dimension badge (bottom-left) -->
      <div id="dim-badge" class="hidden">
        <span id="dim-text">— × — × — mm</span>
      </div>

      <div id="download-bar">
        <button id="code-btn" class="dl-btn" title="View generated CadQuery code">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M5 4L1 8l4 4M11 4l4 4-4 4M9 3l-2 10"/>
          </svg>
          Code
        </button>
        <a id="download-step" class="dl-btn" title="Download STEP">
          <svg viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 12l-4-4h2.5V3h3v5H12L8 12z"/>
            <rect x="2" y="13" width="12" height="1.5" rx=".75"/>
          </svg>
          STEP
        </a>
        <a id="download-stl" class="dl-btn" title="Download STL">
          <svg viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 12l-4-4h2.5V3h3v5H12L8 12z"/>
            <rect x="2" y="13" width="12" height="1.5" rx=".75"/>
          </svg>
          STL
        </a>
      </div>
    </section>

    <!-- ── Right: AI Chat ─────────────────────────────────────────────── -->
    <aside id="chat-panel">
      <div class="chat-header">
        <h2>Chat</h2>
      </div>
      <div id="chat-messages"></div>
      <form id="chat-form">
        <textarea
          id="chat-input"
          placeholder="Describe a CAD model… (Enter to send, Shift+Enter for newline)"
          rows="3"
          autocomplete="off"
          spellcheck="true"
        ></textarea>
        <button type="submit" id="send-btn">Generate</button>
      </form>
    </aside>

  </main>

  <!-- ── Code Modal ──────────────────────────────────────────────────────── -->
  <div id="code-modal" class="hidden" role="dialog" aria-modal="true" aria-label="Generated CadQuery code">
    <div id="code-modal-panel">
      <div id="code-modal-header">
        <span id="code-modal-title">Generated CadQuery Code</span>
        <div id="code-modal-actions">
          <button id="code-copy-btn" class="modal-action-btn" title="Copy code to clipboard">Copy</button>
          <button id="code-modal-close" class="modal-close-btn" title="Close (Esc)">✕</button>
        </div>
      </div>
      <div id="code-modal-body">
        <pre><code id="code-content" class="language-python"></code></pre>
      </div>
    </div>
  </div>

  <script type="module" src="app.js?v=2"></script>
</body>
</html>
