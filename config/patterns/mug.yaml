name: mug
category: assembly
purpose: "Coffee mug or tea cup: hollow cylindrical body with a rectangular loop handle, joined by .union()."

when_to_use: >-
  Use when the user requests a mug, coffee cup, tea cup, ceramic cup, or any
  cup-shaped object with a handle. The body is a hollow cylinder (closed bottom,
  open top) and the handle is a rectangular frame (box with a rectangular
  through-cut). Both parts are built separately and joined with .union().

idiom: |
  import math

  outer_dia = 85.0;  height = 95.0;  wall_mm = 5.0
  inner_r    = (outer_dia - 2 * wall_mm) / 2
  bore_depth = height - wall_mm

  handle_outer_h = 55.0   # handle loop outer height
  handle_outer_w = 28.0   # handle loop outer width (radial depth)
  handle_t       = 8.0    # handle cross-section thickness
  handle_inner_h = 40.0   # grip opening height
  handle_inner_w = 12.0   # grip opening width

  cup = (
      cq.Workplane("XY")
      .cylinder(height, outer_dia / 2)
      .faces(">Z").workplane()
      .circle(inner_r).cutBlind(-bore_depth)
  )
  handle = (
      cq.Workplane("YZ")
      .box(handle_outer_h, handle_t, handle_outer_w)
      .faces(">Z").workplane()
      .rect(handle_inner_h, handle_inner_w).cutThruAll()
  )
  handle = handle.translate(
      (outer_dia / 2 + handle_outer_w / 2 - handle_t / 2, 0, height / 2)
  )
  result = cup.union(handle)

avoid:
  - "NEVER use .shell() on a cylinder -- use .circle(inner_r).cutBlind(-bore_depth) for the inner cavity"
  - "Do NOT model the handle as a torus, sweep, or loft -- use a rectangular box with cutThruAll"
  - "Do NOT use OCC direct API (cq.Wire.makeSpline, gp_Pnt, etc.) for the handle curve"
  - "Do NOT use cq.Assembly -- use simple .union() for two-body joins"
  - "handle_inner_h and handle_inner_w must be smaller than handle_outer_h and handle_outer_w minus 2*handle_t"
  - "handle_t (cross-section thickness) must be >= 4 mm to avoid thin-wall export issues"

parameters:
  outer_dia_mm:     {type: float, unit: mm, description: "Cup outer diameter"}
  height_mm:        {type: float, unit: mm, description: "Cup total height"}
  wall_mm:          {type: float, unit: mm, description: "Cup wall and bottom thickness; minimum 3 mm"}
  handle_outer_h_mm:{type: float, unit: mm, description: "Handle loop outer height (along Z)"}
  handle_outer_w_mm:{type: float, unit: mm, description: "Handle loop outer width (radial depth)"}
  handle_t_mm:      {type: float, unit: mm, description: "Handle cross-section thickness; minimum 4 mm"}
  handle_inner_h_mm:{type: float, unit: mm, description: "Grip opening height; must be < handle_outer_h - 2*handle_t"}
  handle_inner_w_mm:{type: float, unit: mm, description: "Grip opening width; must be < handle_outer_w - 2*handle_t"}

example: |
  import cadquery as cq


  def build_model():
      """Coffee mug: hollow cylinder body + rectangular loop handle."""
      # Cup body dimensions
      outer_dia = 85.0    # mm
      height    = 95.0    # mm
      wall_mm   = 5.0     # mm

      inner_r    = (outer_dia - 2 * wall_mm) / 2
      bore_depth = height - wall_mm

      # Handle dimensions
      handle_outer_h = 55.0   # mm -- loop outer height
      handle_outer_w = 28.0   # mm -- loop outer radial depth
      handle_t       = 8.0    # mm -- cross-section thickness
      handle_inner_h = 40.0   # mm -- grip opening height
      handle_inner_w = 12.0   # mm -- grip opening width

      # Build cup body: hollow cylinder with closed bottom
      cup = (
          cq.Workplane("XY")
          .cylinder(height, outer_dia / 2)
          .faces(">Z").workplane()
          .circle(inner_r).cutBlind(-bore_depth)
      )

      # Build handle: rectangular frame (box + through-cut)
      handle = (
          cq.Workplane("YZ")
          .box(handle_outer_h, handle_t, handle_outer_w)
          .faces(">Z").workplane()
          .rect(handle_inner_h, handle_inner_w).cutThruAll()
      )

      # Position handle flush against cup side, centred at mid-height
      dx = outer_dia / 2 + handle_outer_w / 2 - handle_t / 2
      handle = handle.translate((dx, 0, height / 2))

      return cup.union(handle)

repair_hints:
  - "Inner cavity missing: ensure .faces('>Z').workplane() before .circle(inner_r).cutBlind(-bore_depth)."
  - "Handle not attached: dx = outer_dia/2 + handle_outer_w/2 - handle_t/2 -- verify translate() values."
  - "cutThruAll failed on handle: the handle box must be complete before calling cutThruAll."
  - "union() failed: both cup and handle must be valid cq.Workplane objects; check each separately."
  - "handle_inner dimensions must be < (handle_outer - 2*handle_t) or cutThruAll produces nothing."
  - "If wall_mm is too thin (< 3): increase to 5 mm to avoid geometry validation failure."
