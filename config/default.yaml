llm:
  # Provider: qwen | openai | anthropic | local
  # Override at runtime with env vars: LLM_PROVIDER, LLM_MODEL
  provider: "qwen"
  model: "qwen3-coder-30b-a3b-instruct"
  temperature: 0.2
  max_tokens: 4096
  # Per-request HTTP timeout (seconds). Prevents hanging when the API gateway
  # times out silently. 120s is sufficient for direct-answer (thinking: false).
  timeout_s: 120
  # Qwen3 thinking mode. false = direct answer (~10-30s), true = chain-of-thought
  # (~2-5min, risks 504 Gateway Timeout on DashScope). Keep false for production.
  thinking: false

agents:
  # Multi-agent mode: Architect -> PatternSelector -> Designer -> Critic
  # Set enabled: false to fall back to the single-LLM path (not recommended).
  enabled: true
  # Run Critic after Designer. Critic adds one extra LLM call per request.
  # Set true to enable code review; false for faster generation.
  critic_enabled: false

executor:
  timeout_s: 60

repair:
  max_repair_attempts: 3

exporter:
  formats:
    - "step"
    - "stl"
  output_dir: "outputs"

logging:
  log_dir: "data/logs"
  console_level: "INFO"
